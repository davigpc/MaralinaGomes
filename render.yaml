# render.yaml - Versão ajustada à documentação oficial

services:
  # Serviço 1: Backend Spring Boot (API)
  - type: web
    name: maralina-api
    runtime: java
    plan: free
    rootDir: ControleEstoque
    buildCommand: "./mvnw clean package -DskipTests"
    startCommand: "java -jar target/ControleEstoque-0.0.1-SNAPSHOT.jar"
    healthCheckPath: /api/produtos
    envVars:
      - key: SPRING_DATASOURCE_URL
        fromDatabase:
          name: maralina-db
          property: connectionString
      - key: SPRING_DATASOURCE_USERNAME
        fromDatabase:
          name: maralina-db
          property: user
      - key: SPRING_DATASOURCE_PASSWORD
        fromDatabase:
          name: maralina-db
          property: password
      - key: ALLOWED_ORIGIN
        fromService:
          type: web # O tipo do serviço de frontend
          name: maralina-loja # O nome do serviço de frontend
          property: url # A propriedade que queremos (o seu URL)

  # Serviço 2: Frontend React (Site Estático)
  - type: web                 # Conforme a documentação
    name: maralina-loja
    runtime: static           # Conforme a documentação
    plan: free
    rootDir: maralinagomes-controle-front
    buildCommand: "npm install && npm run build"
    staticPublishPath: dist
    # CORREÇÃO: A propriedade 'rewrites' está agora dentro da secção 'http'
    http:
      rewrites:
        - source: /api/:path*
          destination: ${{services.maralina-api.url}}/api/:path*

databases:
  - name: maralina-db
    plan: free
    databaseName: maralinagomes_db
    user: admin
