# render.yaml - Versão Final e Corrigida com base na documentação oficial

databases:
  - name: maralina-db
    plan: free
    databaseName: maralinagomes_db
    user: admin

services:
  # Serviço 1: Backend Spring Boot (API)
  # Esta secção já estava correta.
  - type: web
    name: maralina-api
    runtime: java
    plan: free
    rootDir: ControleEstoque
    buildCommand: "./mvnw clean package -DskipTests"
    startCommand: "java -jar target/ControleEstoque-0.0.1-SNAPSHOT.jar"
    healthCheckPath: /api/produtos
    envVars:
      - key: SPRING_DATASOURCE_URL
        fromDatabase:
          name: maralina-db
          property: connectionString
      - key: SPRING_DATASOURCE_USERNAME
        fromDatabase:
          name: maralina-db
          property: user
      - key: SPRING_DATASOURCE_PASSWORD
        fromDatabase:
          name: maralina-db
          property: password
      # A variável ALLOWED_ORIGIN será o URL do nosso serviço de frontend abaixo
      - key: ALLOWED_ORIGIN
        fromService:
          type: web # O tipo do serviço de frontend
          name: maralina-loja # O nome do serviço de frontend
          property: url # A propriedade que queremos (o seu URL)

  # Serviço 2: Frontend React (Site Estático)
  # CORREÇÃO APLICADA AQUI:
  - type: web                 # O tipo para um site estático é 'web'
    name: maralina-loja
    runtime: static           # E o runtime é 'static'
    plan: free
    rootDir: maralinagomes-controle-front
    buildCommand: "npm install && npm run build"
    staticPublishPath: dist   # A propriedade correta é 'staticPublishPath'
    rewrites:
      - source: /api/:path*
        destination: ${{services.maralina-api.url}}/api/:path*
