# render.yaml - Versão com a correção final do 'plan'

services:
  # Serviço 1: Backend Spring Boot (API) via Docker
  - type: web
    name: maralina-api
    runtime: docker
    plan: free # ADICIONADO: Garante que o backend use o plano gratuito
    rootDir: ControleEstoque
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/produtos
    envVars:
      - key: SPRING_DATASOURCE_URL
        fromDatabase:
          name: maralina-db
          property: connectionString
      - key: SPRING_DATASOURCE_USERNAME
        fromDatabase:
          name: maralina-db
          property: user
      - key: SPRING_DATASOURCE_PASSWORD
        fromDatabase:
          name: maralina-db
          property: password
      - key: ALLOWED_ORIGIN
        fromService:
          type: web
          name: maralina-loja
          envVarKey: RENDER_EXTERNAL_URL

  # Serviço 2: Frontend React (Site Estático)
  - type: web
    name: maralina-loja
    runtime: static
    # REMOVIDO: A linha 'plan: free' foi removida.
    # A Render seleciona o plano gratuito automaticamente para sites estáticos.
    rootDir: maralinagomes-controle-front
    buildCommand: "npm install && npm run build"
    staticPublishPath: dist

databases:
  - name: maralina-db
    plan: free
    databaseName: maralinagomes_db
    user: admin
