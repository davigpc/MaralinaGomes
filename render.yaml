# render.yaml - Versão Corrigida

# Primeiro, definimos os bancos de dados
databases:
  - name: maralina-db
    plan: free
    databaseName: maralinagomes_db # Nome específico do banco de dados
    user: admin                   # Nome de utilizador

# Em seguida, definimos os serviços da aplicação
services:
  # 1. O Backend Spring Boot (API)
  - type: web
    name: maralina-api
    runtime: java
    rootDir: ControleEstoque   # A pasta do seu backend
    plan: free
    buildCommand: "./mvnw package"
    startCommand: "java -jar target/ControleEstoque-0.0.1-SNAPSHOT.jar"
    envVars:
      - key: SPRING_DATASOURCE_URL
        fromDatabase:
          name: maralina-db         # Conecta-se ao banco de dados definido acima
          property: connectionString

  # 2. O Frontend React (Site Estático)
  - type: static
    name: maralina-loja
    rootDir: maralinagomes-controle-front # A pasta do seu frontend
    plan: free
    buildCommand: "npm install && npm run build"
    publishDir: dist
    rewrites:
      - source: /api/*
        destination: ${{ maralina-api.url }}/api/* # Redireciona chamadas para a API
