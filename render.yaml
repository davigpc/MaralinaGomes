# render.yaml - Versão Simplificada e Válida

services:
  # Serviço 1: Backend Spring Boot (API)
  - type: web
    name: maralina-api
    runtime: java
    plan: free
    rootDir: ControleEstoque
    buildCommand: "./mvnw clean package -DskipTests"
    startCommand: "java -jar target/ControleEstoque-0.0.1-SNAPSHOT.jar"
    healthCheckPath: /api/produtos
    envVars:
      - key: SPRING_DATASOURCE_URL
        fromDatabase:
          name: maralina-db
          property: connectionString
      - key: SPRING_DATASOURCE_USERNAME
        fromDatabase:
          name: maralina-db
          property: user
      - key: SPRING_DATASOURCE_PASSWORD
        fromDatabase:
          name: maralina-db
          property: password
      - key: ALLOWED_ORIGIN
        fromService:
          type: web
          name: maralina-loja
          property: url

  # Serviço 2: Frontend React (Site Estático)
  - type: web
    name: maralina-loja
    runtime: static
    plan: free
    rootDir: maralinagomes-controle-front
    buildCommand: "npm install && npm run build"
    staticPublishPath: dist
    # A regra de rewrite será adicionada manualmente no painel da Render

databases:
  - name: maralina-db
    plan: free
    databaseName: maralinagomes_db
    user: admin
