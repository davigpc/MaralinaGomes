# render.yaml - Versão final e simplificada para garantir o deploy

services:
  # Serviço 1: Backend Spring Boot (API) via Docker
  - type: web
    name: maralina-api
    runtime: docker
    rootDir: ControleEstoque
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/produtos
    envVars:
      - key: SPRING_DATASOURCE_URL
        fromDatabase:
          name: maralina-db
          property: connectionString
      - key: SPRING_DATASOURCE_USERNAME
        fromDatabase:
          name: maralina-db
          property: user
      - key: SPRING_DATASOURCE_PASSWORD
        fromDatabase:
          name: maralina-db
          property: password
      # O URL do frontend será usado na configuração do CORS
      - key: ALLOWED_ORIGIN
        fromService:
          type: web
          name: maralina-loja
          envVarKey: RENDER_EXTERNAL_URL

  # Serviço 2: Frontend React (Site Estático)
  - type: web
    name: maralina-loja
    runtime: static
    plan: free
    rootDir: maralinagomes-controle-front
    buildCommand: "npm install && npm run build"
    staticPublishPath: dist
    # A regra de reescrita será adicionada manualmente depois do deploy

databases:
  - name: maralina-db
    plan: free
    databaseName: maralinagomes_db
    user: admin
