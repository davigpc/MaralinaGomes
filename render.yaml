services:
  # Serviço 1: Backend Spring Boot (API) via Docker
  - type: web
    name: maralina-api
    runtime: docker
    plan: free
    rootDir: ControleEstoque
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/produtos
    envVars:
      # URL original (postgresql://...) usada pelo ENTRYPOINT no Dockerfile
      - key: DATABASE_URL
        fromDatabase:
          name: maralina-db
          property: connectionString
      # Usuário e senha enviados para o Spring Boot
      - key: SPRING_DATASOURCE_USERNAME
        fromDatabase:
          name: maralina-db
          property: user
      - key: SPRING_DATASOURCE_PASSWORD
        fromDatabase:
          name: maralina-db
          property: password
      # Variável para CORS
      - key: ALLOWED_ORIGIN
        fromService:
          type: web
          name: maralina-loja
          envVarKey: RENDER_EXTERNAL_URL

  # Serviço 2: Frontend React (Site Estático) com rewrite para o backend
  - type: web
    name: maralina-loja
    runtime: static
    rootDir: maralinagomes-controle-front
    buildCommand: "npm install && npm run build"
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /api/*
        destination: https://maralina-api.onrender.com/api/*

databases:
  - name: maralina-db
    plan: free
    databaseName: maralinagomes_db
    user: admin
