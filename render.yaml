# render.yaml - Versão Final e Corrigida

# Primeiro, definimos os bancos de dados. Esta secção está correta.
databases:
  - name: maralina-db
    plan: free
    databaseName: maralinagomes_db
    user: admin

# Em seguida, definimos os serviços da aplicação.
services:
  # 1. O Backend Spring Boot (API)
  - type: web
    name: maralina-api
    runtime: java
    rootDir: ControleEstoque
    plan: free
    buildCommand: "./mvnw package"
    startCommand: "java -jar target/ControleEstoque-0.0.1-SNAPSHOT.jar"
    envVars:
      - key: SPRING_DATASOURCE_URL
        fromDatabase:
          name: maralina-db
          property: connectionString

  # 2. O Frontend React (Site Estático) - Usando o tipo 'static' correto
  - type: static
    name: maralina-loja
    rootDir: maralinagomes-controle-front
    plan: free
    buildCommand: "npm install && npm run build"
    publishDir: dist
    rewrites:
      - source: /api/*
        destination: ${{ maralina-api.url }}/api/*
