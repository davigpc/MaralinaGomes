# render.yaml - Versão Final com a estrutura de 'rewrites' corrigida

services:
  # Serviço 1: Backend Spring Boot (API)
  - type: web
    name: maralina-api
    runtime: java
    plan: free
    rootDir: ControleEstoque
    buildCommand: "./mvnw clean package -DskipTests"
    startCommand: "java -jar target/ControleEstoque-0.0.1-SNAPSHOT.jar"
    envVars:
      - key: SPRING_DATASOURCE_URL
        fromDatabase:
          name: maralina-db
          property: connectionString
      - key: SPRING_DATASOURCE_USERNAME
        fromDatabase:
          name: maralina-db
          property: user
      - key: SPRING_DATASOURCE_PASSWORD
        fromDatabase:
          name: maralina-db
          property: password
      - key: ALLOWED_ORIGIN
        fromService:
          type: static_site
          name: maralina-loja
          property: url

  # Serviço 2: Frontend React (Site Estático)
  - type: static_site
    name: maralina-loja
    plan: free
    rootDir: maralinagomes-controle-front
    buildCommand: "npm install && npm run build"
    publishDir: dist
    # A secção de rewrites é movida para fora e para baixo

databases:
  - name: maralina-db
    plan: free
    databaseName: maralinagomes_db
    user: admin

# CORREÇÃO APLICADA AQUI:
# A secção de redirects e rewrites é de nível superior
# e não fica dentro de 'services'.
redirects:
  - source: /api/:path*
    destination: ${{services.maralina-api.url}}/api/:path*
    type: rewrite
