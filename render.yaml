# render.yaml - Versão Corrigida 2.0

databases:
  - name: maralina-db
    plan: free
    databaseName: maralinagomes_db
    user: admin

services:
  # 1. O Backend Spring Boot (API)
  - type: web
    name: maralina-api
    runtime: java
    rootDir: ControleEstoque
    plan: free
    buildCommand: "./mvnw package"
    startCommand: "java -jar target/ControleEstoque-0.0.1-SNAPSHOT.jar"
    envVars:
      - key: SPRING_DATASOURCE_URL
        fromDatabase:
          name: maralina-db
          property: connectionString

  # 2. O Frontend React (Site Estático) - CORRIGIDO
  - type: web # <-- AQUI ESTÁ A MUDANÇA
    name: maralina-loja
    runtime: static # <-- E AQUI
    rootDir: maralinagomes-controle-front
    plan: free
    buildCommand: "npm install && npm run build"
    publishDir: dist # Para o Vite, esta é a pasta correta
    rewrites:
      - source: /api/*
        destination: ${{ maralina-api.url }}/api/*
