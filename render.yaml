# render.yaml - Versão com o tipo de serviço corrigido

# 1. Definição da Base de Dados
databases:
  - name: maralina-db
    plan: free
    databaseName: maralinagomes_db
    user: admin

# 2. Definição dos Serviços da Aplicação
services:
  # Serviço 1: Backend Spring Boot (API)
  - type: web
    name: maralina-api
    runtime: java
    plan: free
    rootDir: ControleEstoque
    buildCommand: "./mvnw clean package -DskipTests"
    startCommand: "java -jar target/ControleEstoque-0.0.1-SNAPSHOT.jar"
    healthCheckPath: /api/produtos
    envVars:
      - key: SPRING_DATASOURCE_URL
        fromDatabase:
          name: maralina-db
          property: connectionString
      - key: SPRING_DATASOURCE_USERNAME
        fromDatabase:
          name: maralina-db
          property: user
      - key: SPRING_DATASOURCE_PASSWORD
        fromDatabase:
          name: maralina-db
          property: password
      - key: ALLOWED_ORIGIN
        value: ${{services.maralina-loja.url}}

  # Serviço 2: Frontend React (Site Estático)
  - type: static_site # CORREÇÃO: "static" foi alterado para "static_site"
    name: maralina-loja
    plan: free
    rootDir: maralinagomes-controle-front
    buildCommand: "npm install && npm run build"
    publishDir: dist
    rewrites:
      - source: /api/:path*
        destination: ${{services.maralina-api.url}}/api/:path*
