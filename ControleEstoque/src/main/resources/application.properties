# Constrói o URL da base de dados no formato JDBC correto
spring.datasource.url=jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}

# Usa o utilizador e a palavra-passe das variáveis de ambiente
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASS}

# Especifica o driver para garantir
spring.datasource.driver-class-name=org.postgresql.Driver

# Configurações do Hibernate (as suas configurações existentes)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
