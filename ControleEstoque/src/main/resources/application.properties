# Usa o URL da base de dados fornecido pela Render e garante o formato JDBC correto
spring.datasource.url=jdbc:${SPRING_DATASOURCE_URL}

# Usa o nome de utilizador e a palavra-passe fornecidos pela Render
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

# Configurações do Hibernate (as suas configurações existentes)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
